<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The League Labs</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="theme-color" content="#0b0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="League Labs" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root { --gold:#ffd66e; --bg:#0b0b0d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:#fff; font-family: -apple-system, system-ui, sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  [hidden] { display:none !important; }
  #app { position:fixed; inset:0; display:flex; justify-content:center; }
  .stage { position:relative; width:100%; height:100%; }
  body.rec .stage { width:min(100vw, calc(100vh * 9 / 16)); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .home { margin:auto; text-align:center; padding:24px; }
  .home h1 { font-size:34px; margin:0 0 4px; letter-spacing:.5px; }
  .home p { opacity:.6; margin:0 0 28px; }
  .home a { display:block; margin:12px auto; width:min(320px,80vw); padding:18px; border-radius:14px; background:#1b1b20; color:#fff; text-decoration:none; font-weight:600; border:1px solid #333; }
  .home a:hover { border-color:var(--gold); }
  .home small { display:block; font-weight:400; opacity:.6; margin-top:4px; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; pointer-events:none; }
  .overlay > * { pointer-events:auto; }
  body.rec .overlay { justify-content:flex-end; padding-bottom:10%; }
  .overlay h2 { margin:0; font-size:clamp(28px,7vw,48px); text-shadow:0 2px 12px #000; }
  .overlay .sub { opacity:.85; text-shadow:0 1px 8px #000; }
  .overlay.passive, .overlay.passive > * { pointer-events:none; }
  button { font:inherit; color:#fff; background:#26262d; border:1px solid #444; border-radius:10px; padding:8px 14px; cursor:pointer; }
  button.primary, button.big { background:var(--gold); color:#1a1305; border-color:var(--gold); font-weight:700; }
  button.big { font-size:22px; padding:14px 38px; border-radius:14px; }
  button.on { outline:2px solid var(--gold); }
  .topbar { position:absolute; top:8px; left:8px; right:8px; display:flex; gap:8px; justify-content:space-between; pointer-events:none; }
  .topbar > div { display:flex; gap:6px; pointer-events:auto; }
  body.rec.playing .topbar { opacity:0; }
  .topbar button { padding:6px 10px; font-size:13px; background:#000a; }
  .editbar { position:absolute; bottom:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:#000c; padding:8px; border-radius:12px; }
  .editbar[hidden] { display:none; }
  .editbar .note { color:var(--gold); font-size:13px; }
  .scanbar { position:absolute; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,#000d 35%); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .scanbar .row { display:flex; gap:10px; align-items:center; width:min(420px,100%); justify-content:center; }
  .scanbar .zoom { flex:1; accent-color:var(--gold); }
  .scanbar .status { font-size:15px; font-weight:600; text-shadow:0 1px 6px #000; min-height:20px; text-align:center; }
  .topbar button.on { background:var(--gold); color:#1a1305; outline:none; }
  .hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:13px; opacity:.6; pointer-events:none; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
